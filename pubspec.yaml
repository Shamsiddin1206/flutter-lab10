name: tm_classifier
description: "Six-class Teachable Machine image classifier that runs fully on-device."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1    # TensorFlow Lite interpreter
  image_picker: ^1.2.0       # camera and gallery
  image: ^4.5.4              # decode, crop and resize in pure Dart
  http: ^1.5.0               # download an image from a URL

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model/
